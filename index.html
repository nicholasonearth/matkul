<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Ujian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1b1a6b;
    --bg:#ecebf7;
    --card:#ffffff;
    --slot:#fde9c8;
    --hl:#fde3b0;
    --hl-slot:#fdd99a;
    --muted:#a3a3ad;
    --tab-active:#d3d2e8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);font-family:'Poppins',sans-serif;color:var(--navy)}
  body{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}

  header{position:sticky;top:0;z-index:10;background:#fff;height:68px;display:flex;align-items:center;padding:0 22px;gap:30px}
  header button{background:none;border:0;color:var(--navy);cursor:pointer;display:flex}
  header h1{font-size:28px;font-weight:600;letter-spacing:.2px}

  .tabs-wrap{position:sticky;top:68px;z-index:9;background:var(--bg);padding:14px 20px 8px}
  .tabs{display:flex;border:1px solid #b9b8d6;border-radius:24px;height:46px;background:var(--bg);overflow:hidden}
  .tab{flex:1;border:0;background:none;font-family:inherit;font-size:17px;font-weight:600;color:#a8a8b8;cursor:pointer;border-radius:24px;transition:background .2s,color .2s}
  .tab.active{background:var(--tab-active);color:var(--navy)}

  main{padding:22px 40px 40px}
  .card{background:var(--card);border-radius:16px;padding:22px 20px 22px;margin-bottom:14px;box-shadow:0 2px 3px rgba(0,0,0,.12);cursor:pointer;transition:background .15s}
  .card.hl{background:var(--hl)}
  .card.hl .slot{background:var(--hl-slot)}
  .name{font-size:18px;font-weight:500;text-transform:uppercase;line-height:1.3}
  .meta{display:flex;gap:44px;margin-top:12px}
  .meta small{display:block;font-size:12.5px;color:var(--muted);font-weight:400}
  .meta b{display:block;font-size:17px;font-weight:500;margin-top:4px}

  .slot{position:relative;background:var(--slot);border-radius:4px;margin-top:20px;padding:42px 20px 16px;transition:background .15s}
  .slot+.slot{margin-top:12px}
  .badge{position:absolute;top:0;left:10px;background:var(--navy);color:#fff;font-size:14.5px;width:108px;text-align:center;padding:2px 0 3px;border-radius:0 0 6px 6px}
  .date{font-size:17px;font-weight:500}
  .info{display:flex;gap:18px;margin-top:4px;font-size:12px;line-height:1.3}
  .info div{display:flex;align-items:flex-start;gap:6px}
  .info svg{flex:none;margin-top:3px}
  .info .t{width:48px}
  .info .r{width:20px;word-break:break-all}
  .info .s{min-width:16px}

  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <button aria-label="Kembali" onclick="history.back()">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4M11 5l-7 7 7 7"/></svg>
  </button>
  <h1>Ujian</h1>
</header>

<div class="tabs-wrap">
  <div class="tabs">
    <button class="tab active" data-tab="uts">UTS</button>
    <button class="tab" data-tab="uas">UAS</button>
  </div>
</div>

<main id="list"></main>

<script>
const UTS = [
  {n:"Probabilitas dan Statistik",k:"A11.4314",sks:3,s:[["Teori","Rabu, 11 November 2026","10:00 - 12:00","H.4.9","3 61"]]},
  {n:"Logika Informatika",k:"A11.4301",sks:3,s:[["Teori","Senin, 02 November 2026","10:00 - 12:00","H.3.1","15"]]},
  {n:"Rekayasa Perangkat Lunak",k:"A11.4301",sks:3,s:[["Teori","Jumat, 06 November 2026","06:00 - 08:00","H.3.1","19"]]},
  {n:"Basis Data",k:"A11.4301",sks:4,s:[
    ["Teori","Rabu, 04 November 2026","15:30 - 17:30","H.3.1","18"],
    ["Praktikum","Jumat, 30 October 2026","10:20 - 12:00","-","-"]]},
  {n:"Pemrograman Berbasis Web",k:"A11.4305",sks:2,s:[["Praktikum","Jumat, 06 November 2026","16:30 - 18:00","H.5.1","018"]]},
  {n:"Sistem Operasi",k:"A11.4304",sks:3,s:[["Teori","Jumat, 13 November 2026","12:30 - 13:30","H.3.10","10 7"]]},
  {n:"Etika Profesi",k:"A11.4702",sks:2,s:[["Teori","Jumat, 06 November 2026","14:00 - 16:00","H.3.8","5 4"]]},
  {n:"Technopreneurship",k:"A12.6703",sks:2,s:[["Teori","Selasa, 03 November 2026","15:30 - 17:30","H.4.12","4 3 7"]]},
  {n:"Pendidikan Kewarganegaraan",k:"N604B",sks:2,s:[["Teori","Selasa, 03 November 2026","-","-","-"]]},
];
const UAS = [];

const icClock='<svg width="11" height="11" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#1b1a6b"/><path d="M12 6v6l-3 2" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>';
const icPin='<svg width="11" height="13" viewBox="0 0 24 28"><path d="M12 0C5.4 0 0 5.2 0 11.6 0 20 12 28 12 28s12-8 12-16.4C24 5.2 18.6 0 12 0z" fill="#1b1a6b"/><circle cx="12" cy="11" r="4.2" fill="#fde9c8"/></svg>';
const icSeat='<svg width="14" height="11" viewBox="0 0 28 22"><rect width="28" height="22" rx="3" fill="#1b1a6b"/><circle cx="8.5" cy="8.5" r="3.4" fill="#fde9c8"/><path d="M3 17c.6-3.4 2.8-4.8 5.5-4.8S13.4 13.6 14 17z" fill="#fde9c8"/><rect x="16.5" y="6" width="8" height="2.4" rx="1" fill="#fde9c8"/><rect x="16.5" y="11" width="8" height="2.4" rx="1" fill="#fde9c8"/></svg>';

const brk = s => s.replace(/ /g,'<br>');
function slot([type,date,time,room,seat]){
  const t = time==='-' ? '-' : time.replace(' - ',' -<br>');
  const r = room.length>3 ? room.replace(/^(H\.\d+)(\.)/,'$1<br>$2') : room;
  return `<div class="slot"><span class="badge">${type}</span>
    <p class="date">${date}</p>
    <div class="info">
      <div>${icClock}<span class="t">${t}</span></div>
      <div>${icPin}<span class="r">${r}</span></div>
      <div>${icSeat}<span class="s">${brk(seat)}</span></div>
    </div></div>`;
}
function render(data){
  const list=document.getElementById('list');
  if(!data.length){list.innerHTML='<p class="empty">Belum ada jadwal ujian</p>';return;}
  list.innerHTML=data.map(c=>`<div class="card">
    <p class="name">${c.n}</p>
    <div class="meta"><div><small>Kelompok</small><b>${c.k}</b></div><div><small>SKS</small><b>${c.sks}</b></div></div>
    ${c.s.map(slot).join('')}
  </div>`).join('');
  list.querySelectorAll('.card').forEach(el=>{
    const on=()=>el.classList.add('hl'), off=()=>el.classList.remove('hl');
    el.addEventListener('pointerdown',on);
    ['pointerup','pointerleave','pointercancel'].forEach(e=>el.addEventListener(e,()=>setTimeout(off,180)));
  });
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));
  render(b.dataset.tab==='uts'?UTS:UAS); window.scrollTo(0,0);
});
render(UTS);
</script>
</body>
</html>
